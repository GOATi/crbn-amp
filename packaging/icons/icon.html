<!doctype html>
<!-- CRBN Rig's PLACEHOLDER app icon (D-CRBN-002 (d), D-CRBN-021): the CRBN placeholder tile (crbn-pdf
     assets/app-icon/pdfcraft.svg's geometry on a 512 grid) in Rig's deeper cherry #d92b52, with the word in the
     suite's Poppins 700. Replace with the owner's final artwork. render.mjs serves this page on loopback to headless
     Edge, which POSTs the PNGs it draws back to /result. -->
<meta charset="utf-8">
<title>CRBN Rig icon</title>
<body style="margin:0;background:#000">
<script>
  const report = (m) => fetch('/result', { method: 'POST', body: 'ERR ' + m })
  addEventListener('error', (e) => report(e.message))
  addEventListener('unhandledrejection', (e) => report(e.reason?.message ?? e.reason))
</script>
<script type="module">
const SIZES = [16, 20, 24, 32, 40, 48, 64, 128, 180, 192, 256, 512]
const BRAND = ['#ec5878', '#d92b52', '#c52247', '#ad1a3d'] // lighter, the brand, darker, darkest (Press's ramp, in cherry)
const INK = '#111'

const font = new FontFace('Poppins', 'url(../../web/src/look/fonts/poppins-700.woff2)', { weight: '700' })
document.fonts.add(await font.load())

function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); g.fill() }

function master() {
  const c = new OffscreenCanvas(512, 512)
  const g = c.getContext('2d')
  const grad = () => { const r = g.createRadialGradient(138, 118, 0, 138, 118, 450); [0, 0.35, 0.7, 1].forEach((o, i) => r.addColorStop(o, BRAND[i])); return r }
  g.fillStyle = grad(); rr(g, 0, 0, 512, 512, 112)
  g.fillStyle = INK; g.beginPath(); g.arc(132, 170, 80, 0, 2 * Math.PI); g.fill()
  g.fillStyle = grad(); g.beginPath(); g.arc(132, 170, 37, 0, 2 * Math.PI); g.fill()
  g.fillStyle = INK
  rr(g, 232, 90, 80, 160, 40)
  rr(g, 328, 90, 80, 160, 40)
  rr(g, 52, 294, 408, 34, 17)
  // The word sits where Press's "PDF" does: centred on x 256, baseline 420, caps 55 px tall.
  g.font = '700 79px Poppins'; g.textAlign = 'center'; g.textBaseline = 'alphabetic'
  g.fillText('RIG', 256, 420)
  return c
}

// Halve in steps for a clean downscale, then land on the size.
function scaled(src, size) {
  let cur = src
  while (cur.width / 2 >= size) {
    const n = new OffscreenCanvas(cur.width / 2, cur.height / 2)
    const g = n.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(cur, 0, 0, n.width, n.height); cur = n
  }
  if (cur.width === size) return cur
  const n = new OffscreenCanvas(size, size)
  const g = n.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(cur, 0, 0, size, size)
  return n
}

const big = master()
const out = {}
for (const s of SIZES) {
  const blob = await scaled(big, s).convertToBlob({ type: 'image/png' })
  const bytes = new Uint8Array(await blob.arrayBuffer())
  let bin = ''; for (const b of bytes) bin += String.fromCharCode(b)
  out[s] = btoa(bin)
}
await fetch('/result', { method: 'POST', body: JSON.stringify(out) })
</script>
</body>
