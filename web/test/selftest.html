<!doctype html>
<!-- CRBN Rig's in-browser self-test, served by web/check.mjs beside the built site (never published). It POSTs its
     results to /__result. Checks: the page paints in Capsule with Rig's brand; Rig's hardware (every kit, CRBN by
     default, bound to the settings, Salvage from the library's sheets); the engine plays the example capture in
     this browser, directly and through the real AudioWorklet (rig-processor.js), and the two agree; the cabinet stage
     scales as the desktop's does; the library (R4), its folder in the browser's private folder; favourites on standby
     (R5): pads from the library's favourites, switched by key while the riff plays, and a switch through the worklet
     equal to the engine run directly. -->
<meta charset="utf-8">
<title>CRBN Rig self-test</title>
<body style="margin:0">
<iframe id="page" src="/?example" style="width:1440px;height:900px;border:0"></iframe>
<script type="module">
import { createEngine, packCapture } from '/engine.js'
import { irGain, scaledIR } from '/ir.js'

const results = { checks: [], userAgent: navigator.userAgent }
const check = (name, ok, detail = '') => results.checks.push({ name, ok: Boolean(ok), detail: String(detail) })
const wait = async (fn, ms, what) => {
  const until = performance.now() + ms
  while (performance.now() < until) { try { if (fn()) return true } catch { /* not yet */ } await new Promise((r) => setTimeout(r, 50)) }
  throw new Error(`timed out waiting for ${what}`)
}
const rms = (a) => Math.sqrt(a.reduce((s, v) => s + v * v, 0) / a.length)

try {
  // 1. The page.
  const frame = document.getElementById('page')
  await wait(() => frame.contentDocument?.documentElement.dataset.ready === 'true', 20000, 'the page to be ready')
  const doc = frame.contentDocument, win = frame.contentWindow, html = doc.documentElement
  check('look and product on <html>', html.dataset.look === 'capsule' && html.dataset.product === 'rig', `${html.dataset.look}/${html.dataset.product}`)
  const strip = win.getComputedStyle(doc.querySelector('.brand-strip')).backgroundColor
  check('the brand strip is cherry #d92b52', strip === 'rgb(217, 43, 82)', strip)
  const accent = win.getComputedStyle(html).getPropertyValue('--accent').trim()
  check('cherry is the accent in Capsule', accent.toLowerCase() === '#d92b52', accent)
  // The owner's picks (D-RIG-008): the Amp front layout, the faceplate and LED meters by default, the stompbox mark.
  check('the rig: two meters, the amp and the cabinet', doc.querySelectorAll('.chain > .meter').length === 2 && doc.querySelector('.chain > .amp') && doc.querySelector('.chain > .cab'), doc.querySelectorAll('.chain > *').length)
  check('the picked drawings by default', html.dataset.layout === 'b' && html.dataset.amp === 'b' && html.dataset.meters === 'b', `${html.dataset.layout}/${html.dataset.amp}/${html.dataset.meters}`)
  const hwShown = win.getComputedStyle(doc.getElementById('hw-amp')).display, ladder = win.getComputedStyle(doc.querySelector('#meter-out .m-led')).display
  check('the amp is drawn as hardware, with an LED ladder', hwShown !== 'none' && ladder === 'flex', `${hwShown}/${ladder}`)
  check('the mark is the stompbox in cherry', win.getComputedStyle(doc.querySelector('.rig-mark .m-body')).fill === 'rgb(217, 43, 82)', win.getComputedStyle(doc.querySelector('.rig-mark .m-body')).fill)
  check('the look menu offers Kit’s own, the four finishes and Custom', doc.querySelectorAll('#lm-finish [data-finish]').length === 6, doc.querySelectorAll('#lm-finish [data-finish]').length)
  check('the amp shows the capture', doc.getElementById('amp-logo').textContent.trim() === 'Example capture' && doc.querySelector('#hw-amp .gz .sub')?.textContent.trim() === 'Example capture', doc.querySelector('#hw-amp .gz .sub')?.textContent)
  check('the page’s eight knobs are sliders', doc.querySelectorAll('.knob[role="slider"]').length === 8, doc.querySelectorAll('.knob[role="slider"]').length)
  check('the example capture is shown', doc.getElementById('capture-name').textContent.trim().length > 0, doc.getElementById('capture-name').textContent)
  await doc.fonts.ready
  check('the look fonts loaded', doc.fonts.check('600 15px "Lexend Giga"') && doc.fonts.check('400 13px "Poppins"'))

  // 1b. Rig's hardware (D-RIG-009..015): CRBN by default, every kit drawn and bound to the settings, Salvage's sheets.
  const $d = (s) => doc.querySelector(s), $$d = (s) => [...doc.querySelectorAll(s)]
  const visible = (el) => el && el.getClientRects().length > 0
  const kitIs = (id) => $d(`#hw-amp .hw.k-${id}`) && $d(`#hw-cab .hw.k-${id}`)
  check('CRBN, the owner’s kit, is the default', kitIs('crbn') && $d('#lm-kits-new [data-kit="crbn"]')?.getAttribute('aria-pressed') === 'true', $d('#hw-amp .hw')?.className)
  // At rest Circuit lights the amp's core; its pulses (and the cabinet's) run on picks, as in the lab.
  const lit = (c) => { const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data; let n = 0; for (let i = 3; i < d.length; i += 16) if (d[i] > 8) n++; return n }
  const ampEnergy = () => $d('#hw-amp canvas.en')
  try { await wait(() => ampEnergy().width > 40 && lit(ampEnergy()) > 50, 8000, 'the energy') } catch { /* reported below */ }
  check('its energy draws behind the amp', lit(ampEnergy()) > 50, `${lit(ampEnergy())} lit samples`)
  check('the kits on offer: ten classic, ten energy (CRBN among them)', $$d('#lm-kits-classic [data-kit]').length === 10 && $$d('#lm-kits-new [data-kit]').length === 10, `${$$d('#lm-kits-classic [data-kit]').length} + ${$$d('#lm-kits-new [data-kit]').length}`)
  const sliders = () => $$d('#hw-amp .kn[data-param], #hw-amp .fd[data-param]').filter(visible)
  const drawn = [], unnamed = [], unbound = []
  for (const b of $$d('#lm-kits-classic [data-kit], #lm-kits-new [data-kit]')) {
    b.click()
    const id = b.dataset.kit
    if (!kitIs(id)) { drawn.push(id); continue }
    const logo = $$d('#hw-amp .logo').map((l) => l.textContent).join(' ')
    if (!/CRBN/.test(logo) || !/RIG/i.test(logo)) unnamed.push(`${id}: ${logo}`)
    const s = sliders()
    if (s.length !== 6 || s.some((k) => k.getAttribute('role') !== 'slider') || $$d('#hw-amp .sw[data-param], #hw-cab .sw[data-param]').length !== 3) unbound.push(`${id}: ${s.length}`)
  }
  check('every kit draws its amp and cabinet', !drawn.length, drawn.join(', '))
  check('“CRBN Rig” on every head (D-RIG-009 (d))', !unnamed.length, unnamed.join('; '))
  check('every kit’s six controls and three switches are bound', !unbound.length, unbound.join('; '))

  $d('#lm-kits-classic [data-kit="brit"]').click()
  const fin = () => $d('#hw-amp .hw').style.getPropertyValue('--fin')
  const own = fin()
  $d('#lm-finish [data-finish="cherry"]').click()
  const cherry = fin()
  $d('#lm-finish [data-finish="own"]').click()
  check('a kit opens in its own colours, and a finish recolours it', own === '#c9a24e' && cherry === '#d92b52' && fin() === '#c9a24e', `${own} / ${cherry} / ${fin()}`)

  const kInput = () => $d('#hw-amp .kn[data-param="inputDB"]'), pageInput = () => $d('.knob[data-param="inputDB"]')
  const before = +kInput().getAttribute('aria-valuenow')
  kInput().focus(); kInput().dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true }))
  check('a kit knob sets its setting, and the page’s knob follows', +kInput().getAttribute('aria-valuenow') === before + 1 && +pageInput().getAttribute('aria-valuenow') === before + 1, `${before} -> ${kInput().getAttribute('aria-valuenow')}, page ${pageInput().getAttribute('aria-valuenow')}`)
  kInput().dispatchEvent(new MouseEvent('dblclick', { bubbles: true }))
  const gate = () => $d('#hw-amp .sw[data-param="gateOn"]'), gateBox = $d('input[data-param="gateOn"]')
  gate().click()
  const gateOff = gate().getAttribute('aria-pressed') === 'false' && !gateBox.checked && $d('#hw-amp .cc[data-param="gateThresholdDB"]').classList.contains('off')
  gate().click()
  check('a kit switch turns the gate off and on, dimming its knob', gateOff && gate().getAttribute('aria-pressed') === 'true' && gateBox.checked, `${gateOff}`)
  const sw = (role) => $d(`#hw-amp .sw[data-role="${role}"]`)
  sw('power').click()
  const off = sw('power').getAttribute('aria-pressed') === 'false' && $d('#hw-amp [data-pilot]').textContent === 'Off' && !$d('#hw-amp .hw').classList.contains('on') && doc.getElementById('status-text').textContent === 'Off'
  sw('power').click()
  sw('standby').click()
  const stby = $d('#hw-amp .hw').dataset.standby === 'true' && sw('standby').getAttribute('aria-pressed') === 'false'
  sw('standby').click()
  check('Power and Standby switch the amp, with the pilot and the words', off && stby && $d('#hw-amp [data-pilot]').textContent === 'On' && $d('#hw-amp .hw').dataset.standby === 'false', `${off}/${stby}`)

  $d('#lm-kits-classic [data-kit="hammer"]').click()
  const salvSetup = ['sheet:peel', 'mesh:perf', 'metal:copper', 'glow:valves', 'words:tags'].every((kv) => { const [k, v] = kv.split(':'); return $d(`#lm-salv [data-salv="${k}"][data-val="${v}"]`)?.getAttribute('aria-pressed') === 'true' })
  check('Salvage opens in the owner’s setup on Peeling orange, its choices in the look menu (D-RIG-015, D-RIG-022)', salvSetup && !$d('#lm-salv').hidden && html.dataset.salvWords === 'tags' && $$d('#lm-salv [data-salv="sheet"]').length === 7, `${salvSetup}/${html.dataset.salvWords}/${$$d('#lm-salv [data-salv="sheet"]').length} sheets`)
  await wait(() => /^url\("?data:image\/jpeg/.test($d('#hw-amp .k-hammer .cabinet').style.backgroundImage) && /^url\("?data:image\/jpeg/.test($d('#hw-amp .k-hammer .salv-plate').style.backgroundImage), 15000, 'Salvage’s photographed sheets')
  {
    // the amp from the 3200-pixel Peeling orange, its name plate from the next sheet, Scuffed red (D-RIG-022)
    const sizes = {}
    await Promise.all(['peel', 'scuff'].map((n) => new Promise((ok) => { const im = new win.Image(); im.onload = () => { sizes[n] = `${im.naturalWidth}x${im.naturalHeight}`; ok() }; im.onerror = () => { sizes[n] = 'missing'; ok() }; im.src = `/hw/tex/salvage-${n}.jpg` })))
    const asked = win.performance.getEntriesByType('resource').map((e) => e.name.match(/salvage-(\w+)\.jpg/)?.[1]).filter(Boolean)
    check('Salvage paints from Peeling orange, its plate from Scuffed red, both 3200 pixels wide (D-RIG-022)', sizes.peel === '3200x2400' && sizes.scuff === '3200x2049' && asked.includes('peel') && asked.includes('scuff') && !asked.includes('orange'), `${JSON.stringify(sizes)}; loaded ${asked.join(', ')}`)
    const credits = [...doc.querySelectorAll('#about a')].map((a) => a.getAttribute('href'))
    check('About credits Salvage’s photographs, PixCrafter’s with a link to its page', credits.includes('https://www.pixcrafter.com/grunge-metal-with-peeling-paint-texture-background/') && credits.includes('https://texturelabs.org/textures/metal_294/') && credits.includes('hw/tex/CREDITS.md'), credits.filter((h) => /pixcrafter|texturelabs|CREDITS/.test(h)).join(' '))
  }
  $d('#lm-salv [data-salv="mesh"][data-val="chicken"]').click()
  check('a Salvage choice is kept', JSON.parse(win.localStorage.getItem('crbn-rig/rig')).salv.mesh === 'chicken', win.localStorage.getItem('crbn-rig/rig'))
  $d('#lm-salv [data-salv="mesh"][data-val="perf"]').click()
  $d('#lm-kits-new [data-kit="crbn"]').click()

  // "Use this look in every CRBN app" in a browser (D-CRBN-025): the crbn-look cookie, the look only (the desktop app
  // keeps the suite file instead; packaging/windows/check.mjs).
  {
    const sw = $d('#lm-suite'), flip = (on) => { sw.checked = on; sw.dispatchEvent(new win.Event('change', { bubbles: true })) }
    const cookie = () => { const c = doc.cookie.split('; ').find((x) => x.startsWith('crbn-look=')); return c ? JSON.parse(decodeURIComponent(c.slice(10))) : null }
    flip(true); const on = cookie()
    flip(false); const off = cookie()
    check('in a browser the suite switch keeps the crbn-look cookie, the look only (D-CRBN-025)', on?.every === true && on.from === 'rig' && Object.keys(on.prefs).sort().join() === 'accent,density,display,look,mono,motion,speed,ui' && off?.every === false, `${JSON.stringify(on)} / ${off?.every}`)
    doc.cookie = 'crbn-look=; Path=/; Max-Age=0'
  }

  // 1c. The Rig builder (R1b; D-RIG-009 (c), D-RIG-010 (f)): a player's kit, its RIG1 code, their own art, a reload.
  // In a block, so its names cannot clash with the module's (RIG-015's pitfall).
  {
    const kept = () => JSON.parse(win.localStorage.getItem('crbn-rig/kits') ?? '{"kits":[]}').kits
    const rigKit = () => JSON.parse(win.localStorage.getItem('crbn-rig/rig')).kit
    const part = (k, v) => { const s = $d(`#lm-build select[data-part="${k}"]`); s.value = v; s.dispatchEvent(new Event('change', { bubbles: true })) }
    $d('#lm-build-new').click()
    const mine = kept()[0]
    check('Build a kit keeps a kit of yours, draws it, and opens the builder', kept().length === 1 && rigKit() === mine?.id && $d('#hw-amp .hw.k-builder') && $d('#hw-cab .hw.k-builder') && !$d('#lm-build').hidden && $d(`#lm-kits-mine [data-kit="${mine?.id}"]`)?.getAttribute('aria-pressed') === 'true', `${kept().length} kept, ${rigKit()}, ${$d('#hw-amp .hw')?.className}`)
    part('knob', 'gem'); part('fx', 'storm')
    $d('#lm-build [data-own="#6aa8ff"]').click()
    const nm = $d('#lb-name'); nm.value = 'Blue storm'; nm.dispatchEvent(new Event('input', { bubbles: true }))
    await wait(() => kept()[0].name === 'Blue storm', 3000, 'the name to be kept')
    check('the builder’s parts redraw the amp, and are kept', $$d('#hw-amp .kn.kn-gem').filter(visible).length === 6 && kept()[0].fx === 'storm' && kept()[0].own === '#6aa8ff' && $d('#hw-amp .hw').style.getPropertyValue('--fin') === '#6aa8ff', `${$$d('#hw-amp .kn.kn-gem').filter(visible).length} gem knobs, ${JSON.stringify(kept()[0])}`)

    // Their own art: a knob turns as one picture, a switch is two frames (Off, then On); Rig's light stays on top.
    const put = async (which, text) => {
      const dt = new DataTransfer(); dt.items.add(new File([text], `${which}.svg`, { type: 'image/svg+xml' }))
      const input = $d(`#lm-build input[data-art="${which}"]`); input.files = dt.files; input.dispatchEvent(new Event('change', { bubbles: true }))
    }
    await put('knob', '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><circle cx="200" cy="200" r="190" fill="#fc0"/><rect x="190" y="14" width="20" height="120"/></svg>')
    await wait(() => /blob:/.test($d('#hw-amp .kn[data-param="inputDB"] .art')?.style.backgroundImage ?? ''), 5000, 'the knob art')
    const artTurn = () => win.getComputedStyle($d('#hw-amp .kn[data-param="inputDB"] .art')).transform
    const t0 = artTurn()
    $d('#hw-amp .kn[data-param="inputDB"]').dispatchEvent(new KeyboardEvent('keydown', { key: 'PageUp', bubbles: true }))
    check('their own knob art draws, under Rig’s light, and turns with the knob', artTurn() !== t0 && $d('#hw-amp .kn[data-param="inputDB"] .art').nextElementSibling?.classList.contains('env') && kept()[0].art.knob?.length === 32, `${t0} -> ${artTurn()}`)
    $d('#hw-amp .kn[data-param="inputDB"]').dispatchEvent(new MouseEvent('dblclick', { bubbles: true }))
    await put('sw', '<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300"><rect x="40" y="60" width="130" height="180" fill="#333"/><rect x="250" y="60" width="130" height="180" fill="#3f3"/></svg>')
    await wait(() => $$d('#hw-amp .sw-art').length === 4 && $$d('#hw-cab .sw-art').length === 1, 5000, 'the switch art')
    const gateArt = () => $d('#hw-amp .sw-art[data-param="gateOn"]'), gatePos = () => win.getComputedStyle(gateArt().firstElementChild).backgroundPosition
    const on = gatePos(); gateArt().click(); const off = gatePos(); gateArt().click()
    check('their own switch art shows its Off frame, then its On frame', /^100% 0(px|%)$/.test(on) && /^0(px|%) 0(px|%)$/.test(off) && $d('input[data-param="gateOn"]').checked, `on ${on}, off ${off}`)

    // The template a player draws over: SVG with the kit's own knob and the guides, through the Save dialog.
    let saved = null
    win.showSaveFilePicker = async (o) => ({ createWritable: async () => ({ write: async (b) => { saved = { name: o.suggestedName, text: await b.text() } }, close: async () => {} }) })
    $d('#lb-tpl-save').click()
    await wait(() => saved, 3000, 'the template to save')
    const tpl = new win.DOMParser().parseFromString(saved.text, 'image/svg+xml')
    check('a knob template saves as SVG: the kit’s own knob and the guides', saved.name === 'crbn-rig-knob-gem.svg' && !tpl.querySelector('parsererror') && tpl.querySelector('#knob path') && tpl.querySelector('#guides'), saved.name)
    delete win.showSaveFilePicker

    // The code: copy it, delete the kit, open the code, and the same kit is back (its name, parts and art ids).
    $d('#lb-copy').click()
    await wait(() => $d('#lb-code')?.value.startsWith('RIG1.'), 3000, 'the share code')
    const code = $d('#lb-code').value, before = kept()[0]
    $d('#lb-del').click(); $d('#lb-del').click()
    const gone = kept().length === 0 && rigKit() === 'crbn' && $d('#lm-build').hidden
    $d('#lm-code-open').click(); $d('#lm-code-in').value = `Here's my kit: ${code} have fun`; $d('#lm-code').requestSubmit()
    const back = kept()[0], same = back && ['name', 'fx', 'cut', 'mesh', 'mat', 'knob', 'own'].every((k) => back[k] === before[k]) && back.art.knob === before.art.knob && back.art.sw === before.art.sw
    await wait(() => $d('#hw-amp .kn .art'), 5000, 'the opened kit with its art')
    check('a RIG1 code round-trips a kit: deleted, then opened from a message', gone && same && rigKit() === back.id && $d('#hw-amp .hw.k-builder'), `${gone}/${same}: ${code.slice(0, 24)}…`)
    // The Hardware Lab's own encoding (lab.html shareCode): the owner's CRBN, built there, opens here.
    const lab = 'RIG1.' + win.btoa(unescape(encodeURIComponent(JSON.stringify({ n: 'CRBN', fx: 'circuit', cut: 'honeycomb', mesh: 'perf', mat: 'carbon', knob: 'obsidian', own: '#d92b52' })))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
    $d('#lm-code-open').click(); $d('#lm-code-in').value = lab; $d('#lm-code').requestSubmit()
    const fromLab = kept()[1]
    $d('#lm-code-open').click(); $d('#lm-code-in').value = 'RIG1.not-a-kit'; $d('#lm-code').requestSubmit()
    check('a code from the Hardware Lab opens; one that is not a kit is refused', fromLab?.name === 'CRBN' && fromLab.knob === 'obsidian' && kept().length === 2 && $$d('#hw-amp .kn.kn-obsidian').filter(visible).length === 6 && /isn’t a CRBN Rig kit code/.test(doc.getElementById('toast').textContent), `${kept().length} kept; ${doc.getElementById('toast').textContent}`)
    $d(`#lm-kits-mine [data-kit="${back.id}"]`).click()

    // The kit and its art survive a reload (localStorage and IndexedDB).
    const id = rigKit()
    frame.contentWindow.location.reload()
    await wait(() => frame.contentDocument?.documentElement.dataset.ready === 'true' && frame.contentDocument !== doc, 20000, 'the page to load again')
    const d2 = frame.contentDocument
    await wait(() => /blob:/.test(d2.querySelector('#hw-amp .kn .art')?.style.backgroundImage ?? ''), 5000, 'the art after the reload')
    check('a player’s kit and its own art survive a reload', JSON.parse(frame.contentWindow.localStorage.getItem('crbn-rig/rig')).kit === id && d2.querySelector('#hw-amp .hw.k-builder') && d2.querySelectorAll('#hw-amp .sw-art').length === 4 && d2.getElementById('lb-name')?.value === 'Blue storm', id)
    frame.contentWindow.localStorage.removeItem('crbn-rig/kits')
    frame.contentWindow.localStorage.removeItem('crbn-rig/rig')
  }

  // 1d. Power, Standby, the squeal guard and auto-off (build plan R3, P3-UX U1), on the page as the reload left it.
  {
    const pd = frame.contentDocument, pw = frame.contentWindow, ph = pd.documentElement
    const $p = (s) => pd.querySelector(s), shown = (s) => ($p(s)?.getClientRects().length ?? 0) > 0
    const key = (el) => el.dispatchEvent(new pw.KeyboardEvent('keydown', { code: 'Space', key: ' ', bubbles: true, cancelable: true }))
    const pick = (area, v) => $p(`.segmented[data-rig="${area}"] [data-value="${v}"]`).click()
    const def = ph.dataset.power === 'b' && !shown('.pw-head') && !shown('.pw-big') && $p('#hw-amp [data-pilot]')?.textContent === 'On'
    pick('power', 'a')
    const pill = shown('.pw-head .pw-pill') && $p('.pw-pill').dataset.state === 'on' && $p('#pw-guard-word').textContent === 'Squeal guard on'
    pick('power', 'c')
    const big = shown('.pw-big') && !shown('.pw-head') && $p('.pw-big .pw-word').textContent === 'On'
    pick('power', 'b'); pick('amp', 'a')
    const own = shown('.pw-amp .pw-lamp') && shown('.pw-bat[data-pw="standby"]')
    pick('amp', 'b')
    check('Power: the pilot lamp and toggles by default; the header pill and the big button in the look menu', def && pill && big && own, `${def}/${pill}/${big}/${own}`)

    key(pd.body)
    const stby = ph.dataset.powerState === 'standby' && !$p('#banner').hidden && $p('#banner-title').textContent === 'Standby.' && $p('#hw-amp .hw').dataset.standby === 'true' && $p('#hw-amp [data-pilot]').textContent === 'Standby'
    key(pd.body)
    const on = ph.dataset.powerState === 'on' && $p('#banner').hidden && $p('#hw-amp [data-pilot]').textContent === 'On'
    $p('#look-open').click(); $p('#lm-finish [data-finish="custom"]').click()
    key($p('#cu-hex'))
    const typing = ph.dataset.powerState === 'on'
    $p('#lm-finish [data-finish="own"]').click(); $p('#look-close').click()
    check('Space puts the amp in standby and says so, brings it back, and is left to a field being typed in', stby && on && typing, `${stby}/${on}/${typing}`)

    const g = $p('input[data-param="guardOn"]'), a = $p('input[data-param="autoOff"]')
    check('the squeal guard and auto-off are on out of the box (D-RIG-008 (e))', g.checked && a.checked && g.closest('.toggle').querySelector('.tg-state').textContent === 'On', `${g.checked}/${a.checked}`)

    // The guitar is this browser's fake input, playing a pulled jack (web/check.mjs): auto-off trips through the
    // page's own input and worklet, the banner says why in words, and Turn back on lifts it.
    let stream = null
    const gum = pw.navigator.mediaDevices.getUserMedia.bind(pw.navigator.mediaDevices)
    pw.navigator.mediaDevices.getUserMedia = async (c) => (stream = await gum(c))
    $p('#play-guitar').click()
    await wait(() => !$p('#banner').hidden && /^Auto-off/.test($p('#banner-title').textContent), 15000, 'auto-off in the page')
    const words = `${$p('#banner-title').textContent} ${$p('#banner-body').textContent}`
    const muted = ph.dataset.powerState === 'muted' && $p('#banner').getAttribute('role') === 'alert' && $p('#hw-amp [data-pilot]').textContent === 'Muted' && /Auto-off/.test($p('#status-text').textContent)
    $p('#banner-on').click()
    const lifted = ph.dataset.powerState === 'on' && $p('#banner').hidden
    check('auto-off: a pulled jack through the page’s input mutes it and says why; Turn back on lifts it', muted && lifted && /went dead after a loud pop/.test(words), words)

    // The input device going away (its track ends): standby, said in words; Turn back on opens the input again.
    stream.getAudioTracks()[0].dispatchEvent(new pw.Event('ended'))
    await wait(() => !$p('#banner').hidden && /input device went away/.test($p('#banner-title').textContent), 3000, 'the device banner')
    const before = stream
    $p('#banner-on').click()
    await wait(() => stream !== before && $p('#status-text').textContent.startsWith('Live'), 10000, 'the guitar again')
    check('auto-off: the input device going away mutes it; Turn back on opens the input again', $p('#banner').hidden || /^Auto-off: the input went dead/.test($p('#banner-title').textContent), $p('#status-text').textContent)

  // 1e. The library (build plan R4, P3-UX U3): a folder of the person's captures and IRs, opened through the folder
  // handle a person's pick gives (here the browser's private folder, in place of showDirectoryPicker), indexed by what
  // each file says, searched, filtered, played, starred, drawn three ways, and opened again after a reload; then a
  // generated 5,000-file folder through the dropped-folder path, indexed and searched in time.
  {
    const { libraryFixture, writePrivateFolder } = await import('/__selftest/library-fixture.mjs')
    const template = await (await fetch('/demo/example.nam')).text()
    const NAM_CORE = {
      'A2.nam': 'A2', 'lstm.nam': 'Test LSTM', 'my_model.nam': 'my_model', 'slimmable_container.nam': 'Test LSTM', 'slimmable_wavenet.nam': 'slimmable_wavenet',
      'wavenet.nam': 'Test Model', 'wavenet_a1_standard.nam': 'wavenet_a1_standard', 'wavenet_a2_feature_test.nam': 'Generated WaveNet Model', 'wavenet_condition_dsp.nam': 'Generated WaveNet Model',
    }
    const examples = await Promise.all(Object.keys(NAM_CORE).map(async (f) => ({ path: `NAM Core/${f}`, bytes: new Uint8Array(await (await fetch(`/__examples/${f}`)).arrayBuffer()), expect: { k: 'nam', n: NAM_CORE[f] } })))
    const small = [...examples, ...libraryFixture(300, template)]
    const dir = await writePrivateFolder('Tones', small)
    const listed = small.filter((f) => !f.expect.hidden)
    const ld = () => frame.contentDocument, lw = () => frame.contentWindow
    const $l = (s) => ld().querySelector(s), $$l = (s) => [...ld().querySelectorAll(s)]
    const src = () => $l('#lib-src').textContent, count = () => +$l('#lib-body').dataset.count
    const timing = () => JSON.parse($l('#lib-src').dataset.timing ?? 'null')
    const frameAfter = async (fn) => { await new Promise((r) => lw().requestAnimationFrame(() => setTimeout(r, 0))); const t0 = performance.now(); fn(); await new Promise((r) => lw().requestAnimationFrame(r)); return performance.now() - t0 }
    const search = (v) => frameAfter(() => { const q = $l('#lib-q'); q.value = v; q.dispatchEvent(new (lw().Event)('input')) })
    const kept = () => new Promise((ok) => {
      const req = indexedDB.open('crbn-rig')
      req.onsuccess = () => { const db = req.result, g = db.transaction('lib').objectStore('lib').get('index:handle:Tones'); g.onsuccess = () => { ok(g.result?.entries ?? []); db.close() }; g.onerror = () => ok([]) }
      req.onerror = () => ok([])
    })

    check('the library replaces Your captures: no folder yet, and a way to choose one', /No folder yet/.test(src()) && $l('#lib-empty [data-choose]') && $l('#lib-tools').hidden, src())
    lw().showDirectoryPicker = async () => dir
    $l('#lib-choose').click()
    await wait(() => /captures/.test(src()) && !/reading|looking/.test(src()), 30000, 'the folder to be indexed')
    const caps = listed.filter((f) => f.expect.k === 'nam').length, irs = listed.length - caps
    check('a folder opens and is indexed: its captures and IRs, not its hidden or other files', src() === `Tones · ${caps} captures, ${irs} IRs` && count() === listed.length, `${src()}; expected ${caps} and ${irs}`)

    // What each file says, read from its head and tail by library.js's rules (and RigLibrary.cpp's on the desktop).
    const index = new Map((await kept()).map((e) => [e.p, e]))
    const wrong = []
    for (const f of listed) {
      const e = index.get(f.path), x = f.expect
      if (!e) { wrong.push(`${f.path}: missing`); continue }
      const keys = x.k === 'ir' ? ['k', 'rate', 'ch'] : Object.keys(x)
      for (const k of keys) if (e[k] !== x[k]) wrong.push(`${f.path} ${k}: ${e[k]} vs ${x[k]}`)
      if (x.k === 'ir' && Math.abs(e.sec - x.sec) > 1e-3) wrong.push(`${f.path} sec: ${e.sec} vs ${x.sec}`)
    }
    check('the index reads what each file says: NAM Core’s examples (top, container, tail, none) and the folder’s', !wrong.length && index.size === listed.length, wrong.slice(0, 3).join('; ') || `${index.size} entries`)

    const ms = await search('jcm')
    const shown = $$l('#lib-body .lib-row:not(.hd) b').map((b) => b.textContent)
    check('search as you type: every word must match', count() === listed.filter((f) => /jcm/i.test(f.path)).length && shown.length && shown.every((t) => /JCM/.test(t)), `${count()} for “jcm”, ${ms.toFixed(1)} ms to the frame`)
    await search('NAM Core test lstm')
    check('search reaches the file’s folder and its metadata together', count() === 2, `${count()} for “NAM Core test lstm”`)
    await search('')
    $l('#lib-chips [data-group="cabs"]').click()
    const cabs = count()
    $l('#lib-chips [data-tone="fuzz"]')?.click()
    const fuzzCabs = count()
    $l('#lib-chips [data-group=""]').click()
    const fuzz = count()
    $l('#lib-chips [data-tone="fuzz"]').click()
    check('chips filter by gear and by tone, and All brings everything back', cabs === irs && fuzzCabs === 0 && fuzz === listed.filter((f) => f.expect.tone === 'fuzz').length && count() === listed.length, `cabinets ${cabs}, fuzz cabinets ${fuzzCabs}, fuzz ${fuzz}, all ${count()}`)
    const sortSel = $l('#lib-sort')
    sortSel.value = 'maker'; sortSel.dispatchEvent(new (lw().Event)('change'))
    const firstMaker = $l('#lib-body .lib-row:not(.hd) small')?.textContent
    sortSel.value = 'name'; sortSel.dispatchEvent(new (lw().Event)('change'))
    check('sort by maker', /Bogner|Boss|Darkglass/.test(firstMaker ?? ''), firstMaker)

    // Click to hear it: the capture goes into the amp, its row says Playing; an IR goes into the cabinet.
    await search('Core/wavenet.nam')
    $l('#lib-body .lib-go').click()
    await wait(() => $l('#capture-name').textContent === 'Test Model' && $l('#lib-body .lib-row.playing'), 8000, 'the capture from the library')
    check('a click plays a capture from the library, and its row says Playing (in words)', $l('#amp-logo').textContent === 'Test Model' && /Playing/.test($l('#lib-body .lib-row.playing').textContent) && !$l('#capture-star').hidden, $l('#capture-meta').textContent)
    await search('')
    $l('#lib-chips [data-group="cabs"]').click()
    $l('#lib-body .lib-go').click()
    await wait(() => /ms impulse response/.test($l('#ir-meta').textContent), 8000, 'the IR from the library')
    check('a click puts an IR in the cabinet', $l('#cab-name').textContent === $l('#ir-name').textContent && $l('#lib-body .lib-card.playing, #lib-body .lib-row.playing'), $l('#ir-meta').textContent)
    $l('#lib-chips [data-group=""]').click()

    // A star on every row; Favourites shows them; the amp's own star is the same favourite.
    await search('Core/wavenet.nam')
    $l('#lib-body .lib-star').click()
    await search('')
    $l('#lib-chips [data-favs]').click()
    const favRows = $$l('#lib-body .lib-row:not(.hd)').map((r) => r.querySelector('b').textContent)
    $l('#lib-chips [data-favs]').click()
    check('a star keeps a favourite; Favourites shows it; the rig’s own star agrees', favRows.length === 1 && favRows[0] === 'Test Model' && $l('#capture-star').getAttribute('aria-pressed') === 'true', favRows.join(', '))

    // Favourites on standby (build plan R5, P3-UX U4): the library's favourite captures on pads 1 to 0, in the order
    // starred, held warm by the engine. While the riff plays, keys switch between them (1 to 0, the arrows, the key left
    // of 1), and a digit typed into the search is a search.
    {
      await search('Core/lstm.nam')
      $l('#lib-body .lib-star').click()
      await search('')
      const pad = (i) => $l(`.pads-grid [data-pad="${i}"]`)
      const padName = (i) => pad(i)?.querySelector('.pn')?.firstChild?.textContent ?? ''
      const state = (i) => pad(i)?.dataset.state
      const names = [padName(0), padName(1), padName(2)]
      check('the pads are the library’s favourites, in the order starred', names[0] === 'Test Model' && names[1] === 'Test LSTM' && pad(2)?.classList.contains('empty') && $l('#pads-empty').hidden, names.join(' / '))
      $l('#play-demo').click()
      await wait(() => state(0) === 'playing' && state(1) === 'ready', 15000, 'pad 1 heard and pad 2 warm')
      const press = (code, key, target = ld().body) => target.dispatchEvent(new (lw().KeyboardEvent)('keydown', { code, key, bubbles: true, cancelable: true }))
      const t0 = performance.now()
      press('Digit2', '2')
      await wait(() => state(1) === 'playing' && $l('#capture-name').textContent === 'Test LSTM', 5000, 'key 2')
      const keyMs = performance.now() - t0
      press('ArrowLeft', 'ArrowLeft')
      await wait(() => state(0) === 'playing', 5000, 'the left arrow')
      press('Backquote', '`')
      await wait(() => state(1) === 'playing', 5000, 'the key left of 1')
      check('keys switch pads while the riff plays: 2, the left arrow, and the key left of 1 back', true, `key 2 heard in ${keyMs.toFixed(0)} ms (meters report about every 32 ms)`)
      const q = $l('#lib-q')
      q.focus(); press('Digit1', '1', q)
      await new Promise((r) => setTimeout(r, 300))
      const typed = state(1) === 'playing' && $l('#capture-name').textContent === 'Test LSTM'
      q.blur()
      check('a digit typed into the search is left to the search', typed, state(1))
      const pickPads = (v) => $l(`.segmented[data-rig="pads"] [data-value="${v}"]`).click()
      const isSwitches = ld().documentElement.dataset.pads === 'a' && $$l('.pads-grid.pd-a .disc').length === 10
      pickPads('b'); const isCaps = $$l('.pads-grid.pd-b .kk').length === 10 && state(1) === 'playing'
      pickPads('c'); const isList = $$l('.pads-grid.pd-c .sn').length === 10 && /Playing/.test(pad(1).textContent)
      pickPads('a')
      check('pads are footswitches by default, with keycaps and a setlist in the look menu; Playing in words', isSwitches && isCaps && isList, `${isSwitches}/${isCaps}/${isList}`)
      press('Digit1', '1')
      await wait(() => state(0) === 'playing', 5000, 'key 1')
      $l('#stop').click()
      await search('Core/lstm.nam')
      $l('#lib-body .lib-star').click()
      await search('')
    }

    // The three drawings (D-RIG-008 (d)): the list by default, cards and shelves in the look menu.
    const pickLib = (v) => $l(`.segmented[data-rig="library"] [data-value="${v}"]`).click()
    const isList = ld().documentElement.dataset.library === 'a' && $l('#lib-body .lib-list')
    pickLib('b'); const isCards = $$l('#lib-body .lib-card').length > 10 && !$l('#lib-body .lib-list')
    pickLib('c'); const shelves = $$l('#lib-body .lib-shelf-sec .sec').map((s) => s.textContent)
    pickLib('a')
    check('the library is a list by default, with cards and shelves in the look menu', isList && isCards && shelves.join(',') === 'Amps,Pedals,Full rigs,Cabinets,Other', `${Boolean(isList)}/${isCards}/${shelves.join(',')}`)

    // The page opened again (without ?example, so what was playing comes back too): the folder opens itself again
    // (its handle kept), with the favourite and what was playing.
    const before = ld()
    lw().location.href = '/'
    await wait(() => ld() !== before && ld()?.documentElement.dataset.ready === 'true' && /captures/.test(ld().getElementById('lib-src')?.textContent ?? '') && !/reading|looking/.test(ld().getElementById('lib-src').textContent), 30000, 'the library after a reload')
    const t = timing()
    $l('#lib-chips [data-favs]').click()
    const afterFavs = $$l('#lib-body .lib-row:not(.hd)').map((r) => r.querySelector('b').textContent)
    $l('#lib-chips [data-favs]').click()
    check('after a reload the folder is open again, a quick look, with the favourite and the Playing mark', afterFavs.join() === 'Test Model' && t?.quick && t.read === 0 && $l('#capture-name').textContent === 'Test Model' && $l('#lib-body .lib-row.playing'), `${afterFavs.join()}; ${JSON.stringify(t)}`)

    // A file added to the folder appears on Look again.
    const added = await (await dir.getFileHandle('Added later.nam', { create: true })).createWritable()
    await added.write(template.replace('"Test Model"', '"Added later"')); await added.close()
    $l('#lib-again').click()
    await wait(() => count() === listed.length + 1 && !/reading|looking/.test(src()), 15000, 'the added file')
    check('Look again finds a file added to the folder, reading only it', timing()?.read === 1 && timing()?.quick === false, JSON.stringify(timing()))

    // 5,000 files (build plan R4: under 10 s to index, under 50 ms to search), through a dropped folder's files: the
    // page's own reading, from real files in memory. A browser's private folder adds its own cost per file (about
    // 3 ms each in headless Edge on Box-C), measured in the R4 notes; the desktop check indexes 5,000 from a real disk.
    const big = libraryFixture(5000, template).filter((f) => !f.expect.hidden)
    const dt = new (lw().DataTransfer)()
    for (const f of big) dt.items.add(new (lw().File)([f.bytes], f.path.split('/').pop(), { lastModified: 1762900000000 }))
    const input = $l('#lib-dir')
    input.files = dt.files
    const t0 = performance.now()
    input.dispatchEvent(new (lw().Event)('change'))
    await wait(() => /5,000|4,750/.test(src()) && !/reading|looking/.test(src()), 60000, '5,000 files')
    const indexMs = performance.now() - t0, scan = timing()
    const times = []
    for (const v of ['m', 'ma', 'mar', 'mars', 'marshall', 'marshall c', 'marshall crunch', 'überschall', 'uber', '']) times.push(await search(v))
    const worst = Math.max(...times)
    check('5,000 files index in under 10 s, and a search draws in under 50 ms', indexMs < 10000 && worst < 50 && count() === 5000, `indexed in ${(indexMs / 1000).toFixed(2)} s (${JSON.stringify(scan)}); slowest search ${worst.toFixed(1)} ms to the frame`)
    results.library = { indexMs: Math.round(indexMs), scan, searchMs: +worst.toFixed(1) }
    // the page as the rest of the self-test expects it: the handle folder again, nothing loaded from it
    await lw().navigator.storage.getDirectory().then((r) => r.removeEntry('Tones', { recursive: true })).catch(() => {})
  }

  // 2. The engine in this browser.
  const rate = 48000
  const wasm = await (await fetch('/rig-engine.wasm')).arrayBuffer()
  const capture = new Uint8Array(await (await fetch('/demo/example.nam')).arrayBuffer())
  const decoder = new OfflineAudioContext(1, rate, rate)
  const di = await decoder.decodeAudioData(await (await fetch('/demo/di.wav')).arrayBuffer())
  const input = di.getChannelData(0)

  const engine = await createEngine(wasm.slice(0), rate)
  const loaded = engine.loadSlot(0, packCapture(capture))
  engine.play(0)
  check('the example capture loads', loaded.ok, loaded.error ?? '')
  const direct = new Float32Array(input.length)
  let t0 = performance.now()
  for (let at = 0; at < input.length; at += 128) {
    const n = Math.min(128, input.length - at)
    engine.process(input.subarray(at, at + n), direct.subarray(at, at + n))
  }
  const directMs = performance.now() - t0
  check('the engine plays it (finite, not silent)', direct.every(Number.isFinite) && rms(direct) > 1e-4, `rms ${rms(direct).toExponential(2)}`)
  results.realtime = +(input.length / rate / (directMs / 1000)).toFixed(1)

  // Through the AudioWorklet: the first render quantum passes while the engine instantiates, so rendering pauses after
  // it, the capture goes in, and the riff starts one quantum later. Output from there must equal `direct`.
  async function render(irBuffer) {
    const Q = 128, ctx = new OfflineAudioContext(1, input.length + Q, rate)
    await ctx.audioWorklet.addModule('/rig-processor.js')
    const node = new AudioWorkletNode(ctx, 'crbn-rig', {
      numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1], channelCountMode: 'max', channelInterpretation: 'discrete',
      processorOptions: { wasm: wasm.slice(0) },
    })
    const replies = []
    node.port.onmessage = (e) => replies.push(e.data)
    const src = new AudioBufferSourceNode(ctx, { buffer: di })
    src.connect(node)
    if (irBuffer) { const conv = new ConvolverNode(ctx, { disableNormalization: true, buffer: irBuffer }); node.connect(conv); conv.connect(ctx.destination) }
    else node.connect(ctx.destination)
    src.start(Q / rate)
    const paused = ctx.suspend(Q / rate).then(async () => {
      await wait(() => replies.some((m) => m.type === 'ready'), 15000, 'the worklet engine')
      const { text, weights } = packCapture(capture)
      node.port.postMessage({ type: 'slot', id: 1, slot: 0, text: text.buffer, weights: weights.buffer }, [text.buffer, weights.buffer])
      node.port.postMessage({ type: 'param', name: 'play', value: 0 })
      await wait(() => replies.some((m) => m.type === 'slot'), 15000, 'the capture in the worklet')
      await ctx.resume()
    })
    const rendered = await ctx.startRendering()
    await paused
    const reply = replies.find((m) => m.type === 'slot')
    return { out: rendered.getChannelData(0).subarray(Q), reply }
  }
  t0 = performance.now()
  const dry = await render(null)
  results.workletMs = Math.round(performance.now() - t0)
  check('the worklet loads the capture', dry.reply?.ok, dry.reply?.error ?? '')
  let max = 0
  for (let i = 0; i < direct.length; i++) max = Math.max(max, Math.abs(dry.out[i] - direct[i]))
  check('the worklet output equals the engine run directly', max < 1e-6, `max difference ${max.toExponential(2)}`)

  // The cabinet stage with a unit impulse: the output is the dry output scaled as the desktop scales an IR.
  const impulse = new AudioBuffer({ length: 4, numberOfChannels: 1, sampleRate: rate })
  impulse.getChannelData(0)[0] = 1
  const wet = await render(scaledIR(impulse, rate))
  const ratio = rms(wet.out) / rms(dry.out)
  check('the cabinet stage scales by -18 dB as the desktop does', Math.abs(ratio / irGain(rate) - 1) < 0.01, `ratio ${ratio.toFixed(5)}, expected ${irGain(rate).toFixed(5)}`)

  // A switch through the worklet (build plan R5): two captures in two slots, a browser's dip from one to the other while
  // the riff plays, asked for at a quantum the context pauses on. The worklet's output equals the engine run directly with
  // the same asks at the same blocks.
  {
    const second = new Uint8Array(await (await fetch('/__examples/wavenet_a1_standard.nam')).arrayBuffer())
    const AT = 300 // the block the switch is asked for, about 0.8 s in
    const e2 = await createEngine(wasm.slice(0), rate)
    e2.loadSlot(0, packCapture(capture)); e2.loadSlot(1, packCapture(second)); e2.setParam('switchMode', 1); e2.play(0)
    const want = new Float32Array(input.length)
    for (let b = 0, at = 0; at < input.length; b++, at += 128) {
      if (b === AT) e2.play(1)
      e2.process(input.subarray(at, Math.min(input.length, at + 128)), want.subarray(at, Math.min(input.length, at + 128)))
    }
    const switchAt = e2.slots().switchAt
    const Q = 128, ctx = new OfflineAudioContext(1, input.length + Q, rate)
    await ctx.audioWorklet.addModule('/rig-processor.js')
    const node = new AudioWorkletNode(ctx, 'crbn-rig', {
      numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1], channelCountMode: 'max', channelInterpretation: 'discrete',
      processorOptions: { wasm: wasm.slice(0) },
    })
    const replies = []
    node.port.onmessage = (e) => replies.push(e.data)
    const src = new AudioBufferSourceNode(ctx, { buffer: di })
    src.connect(node); node.connect(ctx.destination)
    src.start(Q / rate)
    const send = (m, ...t) => node.port.postMessage(m, t)
    // a message with a reply after the asks: when it comes back, the worklet has taken them
    const settle = async (n) => { send({ type: 'clearSlot', id: 100 + n, slot: 11 }); await wait(() => replies.some((m) => m.id === 100 + n), 15000, 'the worklet') }
    const first = ctx.suspend(Q / rate).then(async () => {
      await wait(() => replies.some((m) => m.type === 'ready'), 15000, 'the worklet engine')
      for (const [slot, bytes] of [[0, capture], [1, second]]) { const { text, weights } = packCapture(bytes); send({ type: 'slot', id: slot + 1, slot, text: text.buffer, weights: weights.buffer }, text.buffer, weights.buffer) }
      send({ type: 'param', name: 'switchMode', value: 1 }); send({ type: 'param', name: 'play', value: 0 })
      await settle(0)
      await ctx.resume()
    })
    const later = ctx.suspend(((AT + 1) * Q) / rate).then(async () => { send({ type: 'param', name: 'play', value: 1 }); await settle(1); await ctx.resume() })
    const rendered = await ctx.startRendering()
    await Promise.all([first, later])
    const got = rendered.getChannelData(0).subarray(Q)
    let worst = 0
    for (let i = 0; i < want.length; i++) worst = Math.max(worst, Math.abs(got[i] - want[i]))
    check('a switch between two slots through the worklet equals the engine run directly', worst < 1e-6 && switchAt === AT * 128, `max difference ${worst.toExponential(2)}; the dip began at block ${switchAt / 128}`)
  }

  // The squeal guard in a real loop through the worklet (build plan R3): its output, 7 ms later through a band-pass at
  // 2.4 kHz, back into its input over a guitar's hiss, at a loop gain over 1. It grows into a squeal, and the guard mutes
  // it and says at what frequency.
  {
    const seconds = 3, Q = 128, ctx = new OfflineAudioContext(1, seconds * rate, rate)
    await ctx.audioWorklet.addModule('/rig-processor.js')
    const node = new AudioWorkletNode(ctx, 'crbn-rig', {
      numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [1], channelCountMode: 'max', channelInterpretation: 'discrete',
      processorOptions: { wasm: wasm.slice(0) },
    })
    const replies = []
    node.port.onmessage = (e) => replies.push(e.data)
    const hiss = new AudioBuffer({ length: seconds * rate, numberOfChannels: 1, sampleRate: rate }), h = hiss.getChannelData(0)
    let seed = 7
    for (let i = 0; i < h.length; i++) h[i] = ((seed = (seed * 1103515245 + 12345) >>> 0) / 4294967296 - 0.5) * 0.004
    const src = new AudioBufferSourceNode(ctx, { buffer: hiss })
    const delay = new DelayNode(ctx, { delayTime: 0.007, maxDelayTime: 0.05 }), band = new BiquadFilterNode(ctx, { type: 'bandpass', frequency: 2400, Q: 8 }), loop = new GainNode(ctx, { gain: 0.7 })
    src.connect(node); node.connect(delay); delay.connect(band); band.connect(loop); loop.connect(node); node.connect(ctx.destination)
    src.start(Q / rate)
    const paused = ctx.suspend(Q / rate).then(async () => {
      await wait(() => replies.some((m) => m.type === 'ready'), 15000, 'the worklet engine')
      const { text, weights } = packCapture(capture)
      node.port.postMessage({ type: 'slot', id: 1, slot: 0, text: text.buffer, weights: weights.buffer }, [text.buffer, weights.buffer])
      node.port.postMessage({ type: 'param', name: 'play', value: 0 })
      await wait(() => replies.some((m) => m.type === 'slot'), 15000, 'the capture in the worklet')
      await ctx.resume()
    })
    const rendered = await ctx.startRendering()
    await paused
    await new Promise((r) => setTimeout(r, 300))
    const st = replies.filter((m) => m.type === 'meter').map((m) => m.status).find((s) => s?.muted === 1)
    const o = rendered.getChannelData(0), from = Math.min(o.length, Math.round(((st?.at ?? seconds) + 0.15) * rate))
    let after = 0
    for (let i = from; i < o.length; i++) after = Math.max(after, Math.abs(o[i]))
    check('the squeal guard mutes a real feedback loop through the worklet, and says its frequency', st && Math.abs(st.hz - 2400) / 2400 < 0.08 && after === 0, st ? `${st.hz.toFixed(0)} Hz at ${st.at.toFixed(3)} s, then ${after}` : 'no trip')
  }
} catch (err) {
  check('the self-test ran to the end', false, err?.stack ?? err)
